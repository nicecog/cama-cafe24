# 로컬 개발용 PostgreSQL 17 (Cafe24 운영 DB와 메이저 버전 맞춤)
# 사용: docker compose -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: cama-cafe24-postgres
    environment:
      POSTGRES_USER: cama
      POSTGRES_PASSWORD: cama_local_dev
      POSTGRES_DB: cama
    ports:
      - "55432:5432"
    volumes:
      - cama_cafe24_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cama -d cama"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cama_cafe24_pgdata:
