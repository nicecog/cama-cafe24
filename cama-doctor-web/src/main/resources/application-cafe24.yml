# Cafe24 VPS 운영 (의사 웹 BFF)
# --spring.profiles.active=cafe24

server:
  port: ${DOCTOR_WEB_PORT:8081}
  shutdown: graceful
  servlet:
    context-path: ${DOCTOR_WEB_CONTEXT_PATH:/legacy}

spring:
  datasource:
    url: ${DOCTOR_DB_URL}
    username: ${DOCTOR_DB_USER}
    password: ${DOCTOR_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false

cama:
  billive:
    base-url: ${CAMA_BILLIVE_BASE_URL}
  firebase:
    enabled: ${CAMA_FIREBASE_ENABLED:false}
    credentials-path: ${CAMA_FIREBASE_CREDENTIALS_PATH:firebase/cama-service-account.json}

management:
  endpoint:
    health:
      probes:
        enabled: true
