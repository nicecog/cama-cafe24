<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>치료정보</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet"/>
</head>
<body class="webview-page">
<div class="webview-section">
    <h1 class="webview-title" id="wvTitle">—</h1>
    <div class="webview-meta">
        <span id="wvDoctor">—</span>
        <span class="sub" id="wvDept"></span>
    </div>
    <div class="webview-date" id="wvDate"></div>
</div>
<div id="editorHost" class="ql-snow" style="margin:0 16px;">
    <div id="editorBody" class="ql-editor"></div>
</div>
<p class="disclaimer">
    * 본 정보는 질환의 진단과 치료과정에 대한 일반적인 가이드만을 제공합니다. 정보의 적용,진단과 치료에 대한 모든 결정은 담당 의료진과 직접 상의하시기 바랍니다.
</p>
<div class="area-block">
    <div class="area-row">
        <div class="area-label">시기</div>
        <ul class="area-list" id="wvCareTimes"></ul>
    </div>
    <div class="area-row">
        <div class="area-label">영역</div>
        <ul class="area-list" id="wvInterest"></ul>
    </div>
</div>
<div class="font-controls">
    <span>글자크기</span>
    <div class="font-tags">
        <button type="button" class="font-tag active" data-font="NORMAL">보통</button>
        <button type="button" class="font-tag" data-font="LARGE">크게</button>
        <button type="button" class="font-tag" data-font="MORE_LARGE">더크게</button>
    </div>
</div>

<div class="dialog-backdrop" id="wvAlert" role="alertdialog" aria-modal="true">
    <div class="dialog">
        <p id="wvAlertText"></p>
        <div style="text-align:right;margin-top:16px;">
            <button type="button" class="btn" id="wvAlertOk">확인</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    window.__WEBVIEW_SEQ__ = /*[[${seq}]]*/ '';
</script>
<script th:src="@{/js/cama-api.js}"></script>
<script th:src="@{/js/public-care-track.js}"></script>
</body>
</html>
