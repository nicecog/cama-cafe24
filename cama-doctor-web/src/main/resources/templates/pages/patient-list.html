<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>환자 모니터링</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="has-drawer" data-require-auth="true">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main">
    <div class="card">
        <h1 class="card__title">환자 모니터링</h1>
        <div class="toolbar">
            <div class="field">
                <label for="searchType">검색 구분</label>
                <select id="searchType">
                    <option value="name">이름</option>
                </select>
            </div>
            <div class="field">
                <label for="searchText">검색어</label>
                <input id="searchText" type="search" placeholder="이름"/>
            </div>
            <button type="button" class="btn btn-primary" id="btnSearch">검색</button>
        </div>
        <div class="table-wrap">
            <table class="data">
                <thead>
                <tr>
                    <th>#</th>
                    <th>이름</th>
                    <th>생년월일</th>
                    <th>성별</th>
                    <th>질환</th>
                    <th>시기</th>
                    <th>케어트랙진도율</th>
                    <th>최근사용일</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="pager">
            <button type="button" class="btn" id="btnPrev">이전</button>
            <span id="pageInfo"></span>
            <button type="button" class="btn" id="btnNext">다음</button>
        </div>
    </div>
</main>
<script th:src="@{/js/cama-api.js}"></script>
<script th:src="@{/js/app-shell.js}"></script>
<script th:src="@{/js/patient-list.js}"></script>
</body>
</html>
