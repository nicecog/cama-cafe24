<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>서비스 신청 목록</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="has-drawer" data-require-auth="true">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main">
    <div class="card">
        <h1 class="card__title">서비스 신청</h1>
        <div class="toolbar">
            <a class="btn btn-primary" th:href="@{/content-management/treatment/add}">치료정보 등록</a>
        </div>
        <div class="table-wrap">
            <table class="data">
                <thead>
                <tr>
                    <th>#</th>
                    <th>신청자</th>
                    <th>신청일</th>
                    <th>승인일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="pager">
            <button type="button" class="btn" id="btnPrev">이전</button>
            <span id="pageInfo"></span>
            <button type="button" class="btn" id="btnNext">다음</button>
        </div>
    </div>
</main>
<script th:src="@{/js/cama-api.js}"></script>
<script th:src="@{/js/app-shell.js}"></script>
<script th:src="@{/js/service-list.js}"></script>
</body>
</html>
