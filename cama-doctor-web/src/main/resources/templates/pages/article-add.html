<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>볼거리 등록</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet"/>
</head>
<body class="has-drawer" data-require-auth="true">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="app-main">
    <div class="card">
        <p class="breadcrumb"><a th:href="@{/content-management/article/list}">&larr; 볼거리 목록</a></p>
        <h1 class="card__title">볼거리 등록</h1>
        <p class="muted-note">원본 React는 저장 시 API 호출 없이 이전 화면으로 이동합니다. 저장 API 경로가 정해지면 <code>article-add.js</code>를 수정하세요.</p>

        <div class="form-grid treatment-form">
            <div class="form-grid__label">제목</div>
            <div><input id="afTitle" class="input-full" type="text" placeholder="Ex. 컨텐츠 제목을 입력하세요." autocomplete="off"/></div>

            <div class="form-grid__label">상세내용</div>
            <div class="editor-wrap">
                <div id="afEditor"></div>
            </div>
        </div>

        <div class="form-actions-row">
            <button type="button" class="btn btn-danger-outline" id="afBtnCancel">취소</button>
            <button type="button" class="btn btn-success" id="afBtnSave">저장</button>
        </div>
    </div>
</main>
<script th:src="@{/js/cama-api.js}"></script>
<script th:src="@{/js/ui-modal.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script th:src="@{/js/article-add.js}"></script>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
