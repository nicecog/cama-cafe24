<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>로그인 | CAMA ADMIN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="login-page">
<div class="login-card">
    <h1>CAMA Plus 의사 로그인 <span th:text="${stageName}">(운영)</span></h1>
    <form id="loginForm" novalidate>
        <div class="field">
            <label for="principal">아이디</label>
            <input id="principal" name="principal" type="text" autocomplete="username" placeholder="아이디를 입력 하세요."/>
            <div class="error-text" id="errPrincipal"></div>
        </div>
        <div class="field">
            <label for="credentials">비밀번호</label>
            <input id="credentials" name="credentials" type="password" autocomplete="current-password"
                   placeholder="비밀번호를 입력 하세요."/>
            <div class="error-text" id="errCredentials"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:12px;">로그인</button>
    </form>
</div>

<div class="dialog-backdrop" id="loginError" role="alertdialog" aria-modal="true">
    <div class="dialog">
        <h2 style="margin-top:0;font-size:1.1rem;">로그인 실패</h2>
        <p id="loginErrorText"></p>
        <div style="text-align:right;margin-top:16px;">
            <button type="button" class="btn" id="loginErrorClose">확인</button>
        </div>
    </div>
</div>

<script th:src="@{/js/cama-api.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
