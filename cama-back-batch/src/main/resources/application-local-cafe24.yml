# 로컬 PC — Cafe24 스택 (Spring Boot 3.5, JDK 21, PostgreSQL 17)
# 실행: scripts/run-local-cafe24.ps1

server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/cama}
    username: ${DB_USER:cama}
    password: ${DB_PASSWORD:cama_local_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
    open-in-view: false

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

cama:
  batch:
    slack:
      enabled: false
    fcm:
      dry-run: true

logging:
  level:
    root: INFO
    com.cama.batch: DEBUG
