# Cafe24 VPS batch 운영 프로필
# --spring.profiles.active=cafe24

server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

cama:
  batch:
    slack:
      enabled: ${CAMA_BATCH_SLACK_ENABLED:false}
      webhook-url: ${CAMA_BATCH_SLACK_WEBHOOK:}
    fcm:
      dry-run: ${CAMA_BATCH_FCM_DRY_RUN:false}

logging:
  level:
    root: INFO
    com.cama.batch: INFO
