# /etc/nginx/sites-enabled/cama — camaplus.cafe24.com

server {
    server_name camaplus.cafe24.com;
    underscores_in_headers on;
    client_max_body_size 40m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header api_key $proxy_api_key;
        proxy_set_header Authorization $http_authorization;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apk_down/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }

    location /proxy/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header api_key $proxy_api_key;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 40m;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8081/legacy/actuator/;
        proxy_set_header Host $host;
    }

# CAMA legacy doctor-web (as-is backup under /legacy/)
    # Requires --server.servlet.context-path=/legacy on cama-doctor-web

    location ^~ /content-management/ {
        return 301 /legacy$request_uri;
    }

    location ^~ /patient-management/ {
        return 301 /legacy$request_uri;
    }

    location ^~ /service-management/ {
        return 301 /legacy$request_uri;
    }

    location ^~ /legacy/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /legacy {
        return 301 /legacy/;
    }
# react-app-dawplus — CAMA Plus 환자 WebView SPA
    # try_files fallback 은 named location 사용 (location / 프록시로 새지 않도록)

    location ^~ /assets/ {
        root /opt/cama/www/react-app;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location @patient_spa {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = / {
        return 302 /admin/login;
    }

    location = /coaching {
        return 301 /coaching/;
    }

    location = /webview {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location ^~ /webview/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location ^~ /coaching/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location ^~ /wellbeing {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location = /help {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location ^~ /content/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location ^~ /login/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location = /login {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(home|schedule|favorite|signup|hospital|find-account)(/|$) {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }
# CAMA Super Admin SPA — container cama-super-admin:80 (host 127.0.0.1:8083)
    # 브라우저 루트(/)는 /admin/login 으로 리다이렉트. /login 은 환자 WebView SPA 전용.

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
# Unmatched front-end paths → patient SPA (not legacy doctor-web)

    location / {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }


    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/camaplus.cafe24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camaplus.cafe24.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = camaplus.cafe24.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name camaplus.cafe24.com;
    underscores_in_headers on;
    return 404;
}
