    # react-app-dawplus — CAMA Plus 환자 WebView SPA
    # try_files fallback 은 named location 사용 (location / 프록시로 새지 않도록)

    location ^~ /assets/ {
        root /opt/cama/www/react-app;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location @patient_spa {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = / {
        return 302 /admin/login;
    }

    location = /coaching {
        return 301 /coaching/;
    }

    location = /webview {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location ^~ /webview/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location ^~ /coaching/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location ^~ /wellbeing {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location = /help {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location ^~ /content/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location ^~ /login/ {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }

    location = /login {
        root /opt/cama/www/react-app;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(home|schedule|favorite|signup|hospital|find-account|mypage)(/|$) {
        root /opt/cama/www/react-app;
        try_files $uri $uri/ @patient_spa;
        add_header Cache-Control "no-store";
    }
