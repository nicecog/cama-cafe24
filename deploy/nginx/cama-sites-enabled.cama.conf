# /etc/nginx/sites-enabled/cama — camaplus.cafe24.com

server {
    server_name camaplus.cafe24.com;
    underscores_in_headers on;
    client_max_body_size 40m;

    location /api/ {
        client_max_body_size 55m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header api_key $proxy_api_key;
        proxy_set_header Authorization $http_authorization;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apk_down/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }

    location /proxy/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header api_key $proxy_api_key;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 40m;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8081/legacy/actuator/;
        proxy_set_header Host $host;
    }

    # ── include blocks from deploy/nginx/*.conf (merged by vps-deploy-nginx-full.py) ──
    # LEGACY_DOCTOR
    # PATIENT_SPA
    # SUPER_ADMIN
    # SITE_FALLBACK

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/camaplus.cafe24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camaplus.cafe24.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = camaplus.cafe24.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name camaplus.cafe24.com;
    underscores_in_headers on;
    return 404;
}
