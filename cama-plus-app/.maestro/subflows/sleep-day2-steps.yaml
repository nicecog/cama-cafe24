appId: com.camaplus.app
---
- extendedWaitUntil:
    visible: "하루 평균 몇 시간"
    timeout: 45000
- repeat:
    times: 2
    commands:
      - tapOn:
          point: "50%,58%"
      - tapOn:
          text: "6~7시간"
          optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: sleep-tap-next.yaml
- extendedWaitUntil:
    visible: "선택한 시간에 따른"
    timeout: 25000
- runFlow: sleep-tap-next.yaml
- extendedWaitUntil:
    visible: "나는 평균"
    timeout: 30000
- scrollUntilVisible:
    element: "나는 평균"
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    point: "50%,65%"
- eraseText: 40
- inputText: "7"
- hideKeyboard
- runFlow: sleep-tap-complete.yaml
