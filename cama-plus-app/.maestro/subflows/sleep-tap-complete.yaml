appId: com.camaplus.app
---
# 하단 '완료' 버튼 (testid → 텍스트 → 좌표)
- waitForAnimationToEnd:
    timeout: 2000
    optional: true
- runFlow:
    when:
      visible:
        id: "coaching-day-complete"
    commands:
      - tapOn:
          id: "coaching-day-complete"
- runFlow:
    when:
      notVisible:
        id: "coaching-day-complete"
    commands:
      - scrollUntilVisible:
          element: "완료"
          direction: DOWN
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: "완료"
          commands:
            - tapOn: "완료"
      - runFlow:
          when:
            notVisible: "완료"
          commands:
            - tapOn:
                point: "50%,93%"
            - tapOn:
                point: "75%,93%"
                optional: true
