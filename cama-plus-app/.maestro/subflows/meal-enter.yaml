appId: com.camaplus.app
---
# 건강코칭 → 식습관 메인 진입 (이미 식습관 화면이면 스킵)
- extendedWaitUntil:
    visible: "식습관코칭 시작하기"
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: "식습관코칭 시작하기"
    commands:
      - runFlow:
          when:
            visible: "식사습관 가이드|건강한 식습관|식사습관 점검"
          commands:
            - tapOn:
                point: "12%,9%"
            - tapOn:
                text: "확인"
                optional: true
      - runFlow:
          when:
            notVisible: "건강한 습관을 관리하세요"
          commands:
            - tapOn: "건강코칭"
      - extendedWaitUntil:
          visible: "건강한 습관을 관리하세요"
          timeout: 60000
      - tapOn:
          point: "75%,58%"
      - extendedWaitUntil:
          visible: "식습관코칭 시작하기"
          timeout: 30000
