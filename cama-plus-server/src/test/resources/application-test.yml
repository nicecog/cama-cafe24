spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:cama-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

iamport:
  key: test-key
  secure: test-secret

cama:
  hosting:
    storage-type: local
    local-storage-path: ./target/test-files
    image-cdn-base-url: http://localhost:8080/files

jwt:
  token:
    clientSecret: test-jwt-secret-for-unit-tests
